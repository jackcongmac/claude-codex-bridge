name: Feature request
description: Suggest a new bridge, workflow, safety, or documentation improvement.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the bridge do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Codex to Claude
        - Claude to Codex
        - collaboration.md workflow
        - autonomous watcher
        - install/configuration
        - security
        - documentation/examples
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround or simpler option?
